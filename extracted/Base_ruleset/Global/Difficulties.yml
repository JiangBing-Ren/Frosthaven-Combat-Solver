    HeroHealth:
        # Text: "$DIFFICULTY_HERO_AND_SUMMONS_DOUBLE_HEALTH$"
        HeroHealth: 2
        ActiveOn: [Story]
        PositiveEffect: True
    SummonHealth:
        #Text: "$DIFFICULTY_HEALTHY$"
        SummonHealth: 2
        ActiveOn: [Story]
        PositiveEffect: True
    PlusOneLevelModifier:
        Text: "$DIFFICULTY_PLUS_ONE_LEVEL_MODIFIER$"
