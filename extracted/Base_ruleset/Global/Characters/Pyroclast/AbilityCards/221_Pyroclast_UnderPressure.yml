        - Row: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$FH/221_character_ability_cards_pyroclast_under_pressure_2$"
    Bottom:
        - Row: "$FH/221_character_ability_cards_pyroclast_under_pressure_3$"
