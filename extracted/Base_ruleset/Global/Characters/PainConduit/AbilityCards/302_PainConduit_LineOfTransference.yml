Parser: AbilityCard
Name: $FH/302_character_ability_cards_pain_conduit_line_of_transference_1$
Character: PainConduitID
ID: 302
Level: 1
Initiative: 25
Discard: [Discard,Discard]
Prefab: 302_PainConduit_LineOfTransference
Data:
    Top:
        Abilities:
            ТRemoveCondition:
                StartAbilityRequirements: 
                    Type: ThisAbility
                    Vars: 
                        ValidateHasConditionsCanRemove: TargetingActor.Tokens.CountNegativeConditions(true) > 0
                        AttackAbility: CustomAbility.FindAbilityInAction(Ability, "TAttackLineOfTransference")
                        ValidateNotDisarmed: TargetingActor.Tokens.HasKey(CCondition.ENegativeCondition.Disarm) == False
                        ValidateCanAttack: CustomAbility.GetActorsInRangeForAbility(Actor, AttackAbility).Count > 0
                Filter: Self
                HasCondition: True
                HelpBoxTooltipLocKey: "$GUI_CHOOSE_ABILITY_FH_302_character_ability_cards_pain_conduit_line_of_transference_1$"
                SkipAnim: True
                Choose:
                    Abilities:
                        RemoveWound:
                            RemoveConditions: 1
                            Conditions: [Wound]
                        RemoveBrittle:
                            RemoveConditions: 1
                            Conditions: [Brittle]
                        RemoveBane:
                            RemoveConditions: 1
                            Conditions: [Bane]
                        RemovePoison:
                            RemoveConditions: 1
                            Conditions: [Poison]
                        RemoveImmobilize:
                            RemoveConditions: 1
                            Conditions: [Immobilize]
                        RemoveImpair:
                            RemoveConditions: 1
                            Conditions: [Impair]
                        RemoveMuddle:
                            RemoveConditions: 1
                            Conditions: [Muddle]
            TAttackLineOfTransference:
                Attack:
                    Amount: 2
                    DiamondEnhancements: 1
                Range: 
                    Amount: 3
                    SquareEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Attack","Range")
                Vars:
                    PrevAbility: CustomAbility.FindAbilityInPhaseByName("ТRemoveCondition", TargetingActor)
                    AddNegativeConditions: PrevAbility?.ChosenAbility?.GetAllNegativeConditions() || list()
                AnimOverload: CastGivingPain
        Consumes:
            TCAir:
                Elements: Air
                AbilityOverrides:
                    BCAirAttackBuff:
                        ParentName: TAttackLineOfTransference
                        Strength: 2
                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 4
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Mve")
Layout:
    Top:
        - Row:
            - ColumnWidths: "20,30,30"
            - Column:
            - Column:
                - Row: "<b><size=130%><sprite name=Attack> *TAttackLineOfTransference* <size=100%><voffset=1>@TAttackLineOfTransference@"
            - Column:
                - Row: "<mark=#80919922><size=100%><sprite name=Range>*TAttackLineOfTransference.Range* <voffset=1>@TAttackLineOfTransference.Range@</mark>"
        - Row: "<size=20%> "
        - Conditional:
            Top: true
            Layout:
                - Consume:
                    Name: TCAir
                    Text: "+2 <sprite name=Attack>, <sprite name=XP1>"
        - Row: "$FH/302_character_ability_cards_pain_conduit_line_of_transference_2$"
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
