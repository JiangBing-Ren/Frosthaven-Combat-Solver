Parser: AbilityCard
Name: $FH/278_character_ability_cards_trapper_honeypot_1$
Character: TrapperID
ID: 278
Level: 1
Initiative: 18
Discard: [Discard,Discard]
Prefab: 278_Trapper_Honeypot
Data:
    Top:
        Abilities:
            TLoot:
                Loot: 1
                MiscVars:
                    PrintedProperties: list("Loot")
                Target: -2 # -1 forces all loot tokens to be looted without an option not to loot some
                AnimOverload: Loot
                Vars:
                    LootAbility: TargetingActor.SetTempVar("HoneypotLootAbility", Ability)
                    AllowNoTargets: True
                    LootTypesCanSelect: list('MoneyToken')
            TTrap:
                Trap:
                    TrapName: TrapperTrap
                    Damage: 2
                MiscVars:
                    PrintedProperties: list("Damage")
                AnimOverload: TrapThrow
                Vars:
                    LootAbility: TargetingActor.HoneypotLootAbility #TargetingActor.LastAbilityPerformed
                    ValidateHasHappened: LootAbility.AbilityHasHappened
                    TilesWithLoot: LootAbility.m_ValidTilesInRange
                    LootedTiles: TargetingActor.LastAbilityPerformed and LootAbility.TilesSelected
                    NonLootedTiles: TilesWithLoot.Except(LootedTiles).Where(IsEmpty)
                    ValidateHasNonLootedTiles: NonLootedTiles.Count > 0
                Targeting: Custom
                TargetingVars:
                    AddTilesInRange: NonLootedTiles
                    AddSelectedTiles: NonLootedTiles
                AutoTrigger: True
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
            BTrap:
                Trap:
                    TrapName: TrapperTrap
                    Heal: 2
                MiscVars:
                    PrintedProperties: list("Heal")
                Range: 1
                RangeIsBase: True
                AnimOverload: CreateTrap                    
Layout:
    Top:
        - Row: "<b><size=130%><sprite name=Loot> 1"
        - Row: $FH/278_character_ability_cards_trapper_honeypot_2$
    Bottom:
        - Row: "<b><size=130%>$Move$ <sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: $FH/278_character_ability_cards_trapper_honeypot_3$
