CheckAtEndOfScenario: True
BattleGoalCondition:
    - Targets:
        Filter: UseLowestInitiativeCard
        Value: 0
        SubFilter: Scenario
BattleGoalFailCondition:
    - Targets:
        Filter: UseLowestInitiativeCard
        Value: 1
        SubFilter: Scenario