Parser: Mastery
ID: Geminate_MASTERY_2
LocalisedName: Geminate_MASTERY_2_Name
LocalisedDescription: Geminate_MASTERY_2_Desc
PerkPoints: 1
# check if you lost cards at least once in each round
CheckAtEndOfScenario: True
BattleGoalCondition:
    - Targets:
        # check how many cards you lost
        Filter: LoseCards
        # each round
        SubFilter: EveryRoundCharactersOnly
        StopCheckingAfterDeath: True
        # only for the geminate
        CharacterIDs: 
            ActorID: GeminateID
        # at least 1 lost card
        Targets: 1
        Value: 1
# check if you failed to lose cards in any round
BattleGoalFailCondition:
    - Targets:
        # check how many cards you lost
        Filter: LoseCards
        # each round
        SubFilter: EveryRoundCharactersOnly
        StopCheckingAfterDeath: True
        # only for the geminate
        CharacterIDs: 
            ActorID: GeminateID
        # 0 lost cards
        Targets: 0
        Value: 1