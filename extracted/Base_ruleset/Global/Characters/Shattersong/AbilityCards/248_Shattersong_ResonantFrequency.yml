                MiscVars:
                    PrintedProperties: list("Damage")     
                Filter: Self
                TextOnly: True
                AutoTrigger: True
            BBrittleSelf:
                Brittle: True
                Filter: Self
                TextOnly: True
                AutoTrigger: True
                SkipAnim: True
Layout:
    Top:
        - Row: "$FH/248_character_ability_cards_shattersong_resonant_frequency_2$"
        - Conditional:
            Layout:
                - Consume:
                    Name: TCEarth
                    Text: "<size=100%>+1 <sprite name=Attack>, <sprite name=XP>"
    Bottom:
        - Row: "$FH/248_character_ability_cards_shattersong_resonant_frequency_3$"
        - MandatoryTrigger:  "$FH/248_character_ability_cards_shattersong_resonant_frequency_4$"
        - MandatoryTrigger:  "$FH/248_character_ability_cards_shattersong_resonant_frequency_5$"
