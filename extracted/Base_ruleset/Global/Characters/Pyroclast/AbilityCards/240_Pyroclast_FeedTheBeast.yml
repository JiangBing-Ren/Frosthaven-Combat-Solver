Character: PyroclastID
ID: 240
Level: 8
Initiative: 27
Discard: [Discard,Discard]
Prefab: 240_Pyroclast_FeedTheBeast
Data:
    Top:
        XP: 1
        Abilities:    
            TDestroyHazardous:
