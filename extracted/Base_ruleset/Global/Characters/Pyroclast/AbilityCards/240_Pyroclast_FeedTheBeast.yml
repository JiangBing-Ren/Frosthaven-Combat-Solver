                                AnimOverload: FeedTheBeast
                            TDealDamage:
                                UseParentTargets: False
                                Damage: 5
                                MiscVars:
                                    PrintedProperties: list("Damage")
                                Filter: Enemy
                                AutoTrigger: True
                                Target: -1
                                Targeting: Custom
                                SkipAnim: True
                                TargetingVars:
                                    DesignatedHex: ParentAbility.ParentAbility.TilesSelected[0]
                                    AddValidActorsInRange: list(DesignatedHex).Select(obj.LivingActor).Where(obj != null)
                                    PrevAbility: CustomAbility.FindAbilityInPhaseByName("TCreateHazardous240")
                                    PrevAbilityTiles: PrevAbility?.CachedSpawnTiles
                                    AddValidActorsInRange: PrevAbilityTiles?.Select(obj.LivingActor)?.Where(obj != null)
