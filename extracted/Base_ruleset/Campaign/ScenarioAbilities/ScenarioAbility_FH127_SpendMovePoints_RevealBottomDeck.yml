Parser: ScenarioAbility
ID: ScenarioAbility_FH127_SpendMovePoints_RevealBottomDeck
ScenarioAbility:
    SkipMove2ToRevealLowerDeck:
        PreviewEffectText: ""
        Filter: Self
        SkipAnim: True
        NullTargeting: True
        ActiveBonus:
            ListLayoutOverride: [$FH/FH_Scenario_Campaign_127_SpendMovePoints_RevealBottomDeck$, Move]
            Duration: Persistent
            ValidAbilityType: Move
            IsToggleBonus: True
            Hidden: True
            Requirements:
                DoesntHaveNegativeCondition: [Stun, Immobilize]
                Vars:
                    CurrentAbility: PhaseManager.CurrentPhaseAction.CurrentPhaseAbility?.m_Ability
                    ValidateHasEnoughMovePoints: CurrentAbility != null && CurrentAbility.RemainingMoves >= 2
                    ValidateIsOnStairs: ScenarioScript_FH127.CanTeleportToNextDeck(Actor)
            CostAbility:
                NullTargeting: True
                Filter: Self
                MiscVars:
                    TreatAsNewStart: True
                Vars:
                    CacheActiveBonus: PhaseManager.CurrentPhaseAction.CurrentTriggeredActiveBonus
                PerformVars:
                    ApplyToActors:
                        UntoggleBonus: CacheActiveBonus.ToggleActiveBonusFromVars(TargetingActor, true)
                        PayMovement: CustomAbility.PayMovementPoints(2, TargetingActor, CacheActiveBonus)
                        TeleportActor: ScenarioScript_FH127.TeleportToBottomDeck(TargetingActor)