                - Row: "<size=130%><sprite name=MMPressureLow><size=100%><sprite name=Heal> 3, $Self$, <sprite name=XP1>, <sprite name=MMGainPressure>"
    Bottom:
        - Row: "$FH/434_character_ability_cards_metal_mosaic_magnetic_field_4$"
        - Divider:
        - Row: "$FH/434_character_ability_cards_metal_mosaic_magnetic_field_5$"
        - Divider:
        - Active:
            Ability: BShield
            Icon: Positive_Shield
            ListLayout: "<sprite name=Shield> *BShield*"
            Layout: "<sprite name=Shield> *BShield*"
        - MandatoryTrigger:
            Layout:
                - Row: "<size=130%><sprite name=MMPressureOver><size=100%> <sprite name=Shield> 1 $Self$"
