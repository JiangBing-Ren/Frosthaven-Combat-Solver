Parser: AbilityCard
Name: $FH/292_character_ability_cards_trapper_proficient_hunter_1$
Character: TrapperID
ID: 292
Level: 5
Initiative: 26
Discard: [Lost,Discard]
Prefab: 292_Trapper_ProficientHunter
Data:
    Top:
        Abilities:
            TBuffNextTrap:
                AddActiveBonus:
                    NullHex: True
                    HelpBoxTooltipLocKey: "$FH/292_character_ability_cards_trapper_proficient_hunter_2$"
                    Targeting: Custom
                    TargetingVars:
                        AddTilesInRange: TrapTiles
                    #AnimOverload: EnhanceTrap_Strong
                    SkipAnim: True
                    PerformVars:
                        AnimateCharacter: #Perform:
                            Trap: TilesSelected.First?.Trap
                            SetSelectedTrap: TargetingActor.SetTempVar("LastSelectedTrap", Trap)
                    SubAbilities:
                        ChooseHealOrDamageAbility:
                            Filter: Self
                            HelpBoxTooltipLocKey: $FH/281_character_ability_cards_trapper_flurry_of_nails_5$
                            PreviewEffectText: "<size=100%><sprite name=Damage>2 / <sprite name=Heal>2</size>"
                            IsInlineSubAbility: true
                            CanUndo: False
                            UseParentTargets: False
                            Vars:
                                Trap: TargetingActor.LastSelectedTrap
                                ForcePreviewTiles: list(Trap.PropTile)
                            Targeting: Custom
                            TargetingVars:
                                AddTileInRange: Trap.PropTile
                                AddSelectedTile: Trap.PropTile
                            Choose:
                                Abilities:
                                    ImproveDamage:
                                        CanUndo: False
                                        PreviewEffectText: "<sprite name=Damage>2"
                                        Null:
                                        AnimOverload: EnhanceTrap_Strong
                                        Vars:
                                            TargetedTilesForVFX: list(Trap.PropTile)
                                        PerformVars:
                                            NullBegin:
                                                ImproveTrap: CustomAbility.AddTrapDamage(Trap, 2)
                                                RestrictActiveBonus: ActiveBonus.RestrictActiveBonus(TargetingActor, true)
                                    ImproveHeal:
                                        CanUndo: False
                                        PreviewEffectText: "<sprite name=Heal>2"
                                        Null:
                                        AnimOverload: EnhanceTrap_Strong
                                        Vars:
                                            TargetedTilesForVFX: list(Trap.PropTile)
                                        PerformVars:
                                            NullBegin:
                                                ImproveTrap: CustomAbility.AddTrapHeal(Trap, 2)
                                                RestrictActiveBonus: ActiveBonus.RestrictActiveBonus(TargetingActor, true)

                AnimOverload: PowerUpStrong
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: DuringActionAbilityOnAbilityEnded
                    ValidAbilityTypes: Trap
                    Restriction: OncePerRound
                    Flags: [ManualRestrict]
                    TriggerOnCaster: True
                    Vars:
                        TrapAbility: TriggerAbility
                        ValidateHappened: TrapAbility != null && TrapAbility.AbilityHasHappened
                        TrapTiles: TrapAbility?.TilesSelected #?.Where(Trap and (Trap.Damage or Trap.HealValue > 0))
                        ValidateTraps: "!!TrapTiles?.First"
        XP: 2
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 5
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
            BTrap:
                Trap:
                    TrapName: TrapperTrap
                    Conditions: Regenerate
                Range: 1
                RangeIsBase: True
                AnimOverload: CreateTrap
            
Layout:
    Top:
        - Active:
              Ability: TBuffNextTrap
              ListLayout: "$FH/292_character_ability_cards_trapper_proficient_hunter_2$"
              Layout: "$FH/292_character_ability_cards_trapper_proficient_hunter_2$"
              Icon: "Positive_Trap_Upgrade"
    Bottom:
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: $FH/292_character_ability_cards_trapper_proficient_hunter_3$
