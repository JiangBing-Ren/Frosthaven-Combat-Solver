                - Row: "<mark=#80919922><size=100%><sprite name=Range>*TAttack.Range*</mark>"
        - Divider:
        - MandatoryTrigger: "<sprite name=Damage> 2 $Self$"
    Bottom:
        - Active:
            Ability: BActive
