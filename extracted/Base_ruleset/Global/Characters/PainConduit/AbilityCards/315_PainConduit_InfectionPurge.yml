        XP: 2
        Abilities:
            BPreventDamage:
                # reduce damage taken by 0 so caster takes the full damage
                PreventDamage: 0 
                Filter: Self
                Range: 3
                MiscVars:
                    PrintedProperties: list("Range")
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: PreventAndApplyToActiveBonusCaster
                    ToggleIsOptional: True              
                    DisplayAuraOnCaster: True              
