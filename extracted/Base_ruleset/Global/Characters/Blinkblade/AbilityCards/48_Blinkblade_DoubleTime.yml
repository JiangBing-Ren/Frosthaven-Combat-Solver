                AnimOverload: Attack
                ConditionalOverrides:
                    TAttack2CO_Slow:
                        Self: True
                        Requirement:
                            RequiredAgility: Slow
                        AbilityOverrides:
                            TAttack2:
                                AnimOverload: AttackSlow
            TMove_Fast:
                Move:
                    Amount: 2
                MiscVars:
                    PrintedProperties: list("Move")
                #CanSkip: False
                StartAbilityRequirements:
                    Type: ThisAbility
                    RequiredAgility: Fast
                # Just to add XP to the movement
                ConditionalOverrides:
                    TMoveCO_Fast:
                        Self: True
                        Requirement:
                            RequiredAgility: Fast
                        XP: 1
                        AbilityOverrides:
                            TMove_Fast:
                                Strength: 0
