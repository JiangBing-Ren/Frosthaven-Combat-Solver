            CostAbility:        
                Push: 1
                CanUndo: False
                Flags: [Special1]
                Filter:
                    ActorType: Neutral
                    EnemyType: Object
                Vars:
                    CacheActiveBonus: PhaseManager.CurrentPhaseAction.CurrentTriggeredActiveBonus
