Parser: BattleGoal
ID: BattleGoal_Sleeper
LocalisedName: FH/1337_battle_goals_sleeper_1
LocalisedDescription: FH/1337_battle_goals_sleeper_2
#Have at least 1 card in hand during short/long rests
PerkChecks: 1
CheckAtEndOfScenario: True
BattleGoalCondition:
    - Targets:
        Filter: UseAbility
        AbilityTypes: [LongRest,ShortRest]
        MinCardsInHand: 1
        Value: 1
        SubFilter: Scenario
# fail if you rested with 0 cards in hand
BattleGoalFailCondition:
    - Targets:
        Filter: UseAbility
        AbilityTypes: [LongRest,ShortRest]
        MaxCardsInHand: 0
        Value: 1
        SubFilter: Scenario