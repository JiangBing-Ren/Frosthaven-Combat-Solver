        - Row: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Divider:
        - Row: "<sprite name=Loot> 1"
        - Divider:
        - Conditional:
            Layout:
                - Row: "<sprite name=ConsumeIce>: <size=100%><sprite name=Heal> 2, $Self$"
        - Divider:
        - MandatoryTrigger:
