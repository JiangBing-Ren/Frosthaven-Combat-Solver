Parser: BattleGoal
ID: BattleGoal_Weakling
LocalisedName: FH/BATTLEGOAL_Weakling
LocalisedDescription: FH/BATTLEGOAL_Weakling_Desc
#Become exhausted before any other character.
PerkChecks: 1
BattleGoalCondition:
    - Targets:
        Filter: ExhaustFirst
        Who: [Player]
        Targets: 1
        Conditional:
            Amount: "== 1"
        Value: 1
        SubFilter: Scenario
BattleGoalFailCondition:
    - Targets:
        Filter: ExhaustFirst
        Who: [Player]
        Targets: 1
        Conditional:
            Amount: "== 2"
        Value: 1
        SubFilter: Scenario