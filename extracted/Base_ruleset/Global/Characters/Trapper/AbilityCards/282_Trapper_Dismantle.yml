Parser: AbilityCard
Name: $FH/282_character_ability_cards_trapper_dismantle_1$
Character: TrapperID
ID: 282
Level: X
Initiative: 72
Discard: [Discard,Discard]
Prefab: 282_Trapper_Dismantle
Data:
    Top:
        Abilities:
            TDestroyTrap:
                DisarmTrap: true
                Range: 1
                RangeIsBase: true
                AnimOverload: DisassembleTrap_Tinker
                PerformVars:
                    DisarmTrap:
                        DisarmedTrap: TilesSelected[0].Trap
            TAttack:
                Attack:
                    Amount: 0    # modified by vars
                Range: 
                    Amount: 3
                    SquareEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Attack","Range")
                RangeIsBase: true
                AnimOverload: TrapProjectile
                Vars:
                    DisarmedTrap: TargetingActor.LastAbilityPerformed?.DisarmedTrap
                    ValidateDisarmedTrap: "!!DisarmedTrap"
                    Strength: DisarmedTrap?.GetTrapDamage()
                    AddNegativeConditions: DisarmedTrap?.Conditions
                    AddPositiveConditions: DisarmedTrap?.PositiveConditions
                MiscVars:
                    ApplyPositiveEffectsToTarget: true
    Bottom:
        Abilities:
            BDestroyTrap:
                DisarmTrap: true
                Range: 1
                RangeIsBase: true
                AnimOverload: DisassembleTrap_Tinker
                PerformVars:
                    DisarmTrap:
                        DisarmedTrap: TargetingActor.SetTempVar("LastDisarmedTrap", TilesSelected[0].Trap)
            BMove:
                Move:
                    Amount: 3
                MiscVars:
                    PrintedProperties: list("Move")
            BImproveTrap:
                NullHex: true
                HelpBoxTooltipLocKey: $FH/282_character_ability_cards_trapper_dismantle_6$
                Range: 1
                RangeIsBase: true
                TileFilter: Trap
                AnimOverload: EnhanceTrap_Tinker
                Vars:
                    DisarmedTrap: TargetingActor.LastDisarmedTrap
                    ValidateDisarmedTrap: "!!DisarmedTrap"
                PerformVars:
                    Perform:
                        ProcessTraps: CustomAbility.AddTrapEffects(TilesSelected[0].Trap, DisarmedTrap)
Layout:
    Top:
        - Row: $FH/282_character_ability_cards_trapper_dismantle_2$
        - Row: "<b><size=130%><sprite name=Attack>X<size=100%> <sprite name=Range>*TAttack.Range* @TAttack.Range@"
        - Row: $FH/282_character_ability_cards_trapper_dismantle_3$
    Bottom:
        - Row: $FH/282_character_ability_cards_trapper_dismantle_4$
        - Row: "<size=20%> "
        - Row: "<b><size=130%><sprite name=Move> *BMove*<size=100%>"
        - Row: "<size=20%> "
        - Row: $FH/282_character_ability_cards_trapper_dismantle_5$
