                            MiscVars:
                                PropertyToModify: "'Target'"
                                OverrideIcon: "'FH_UI_1Target'"
                                ResonanceCost: 1
                                RestrictAllBonusesOnCard: True
                            Vars:
                                DistinctID: "'EmpoweringNote'"
                            PerformVars:
                                OnAbilityPerformStarted:
                                    ConsumeResonanceAndRestrict: CustomAbility.ConsumeResonanceActiveBonus(ActiveBonus, Ability)
                                OnAbilityEnded:
                                    UntoggleBonus: CustomAbility.FinishBonusLock(ActiveBonus, BespokeBehaviour, Ability)
                            Requirement:
                                Vars: 
                                    # have to have at least 1 resonance token to spend
                                    ValidateHasResonance: Ability.TargetingActor.GetCurrentAndReservedResonanceTokens() > 0 || CheckingBonus.ToggledBonus
                                    # only let us modify abilities that aren't persistent
                                    ValidateIsntPersistent: CustomAbility.IsPersistentAbility(Ability) == False
                                    # only ability card abilities
                                    ValidateIsShattersongAbilityCard: CustomAbility.IsFromShattersongCard(Ability)

                                    PropertyToModify: CheckingBonus.Ability.ActiveBonusData.GetMiscVar("PropertyToModify")
                                    AbilityToModify: CustomAbility.FindAbilityWithPrintedProperty(PropertyToModify, Ability)
                                    ValidateHasProperty: AbilityToModify != null
                                    AbilityType: AbilityToModify.AbilityType.ToString()               
                                    ValidTypes: list("NullTargeting","Attack","Heal","Muddle","Damage","Wound","ControlActor","DestroyObstacle","Brittle","Push")
                                    ValidateAbilityType: ValidTypes.Contains(AbilityType)
                                    ValidateAreaEffect: AbilityToModify.AreaEffect == null
                                    ValidateIsntTargetSelf: CustomAbility.ExclusiveSelf(AbilityToModify) == False
                                    ValidateCanCurrentlyAddTargets: CustomAbility.IsSelectingTargets(AbilityToModify)
                                    ValidateCanBePerformed: CustomAbility.CanBePerformedAfterConditions(AbilityToModify)
                            ActiveBonusAbilityOverrides:
                                TCOverride:
                                    Target: 1
    Bottom:
