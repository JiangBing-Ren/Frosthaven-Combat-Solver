Parser: Perk
ID: Geminate11
Name: FH/PERK_Geminate_11_Name
Description: FH/PERK_Geminate_11_Desc
CharacterID: GeminateID
Available: 1
Flags: [Passive, ApplyActiveBonusesAtScenarioStart]
Abilities:
    TActive:
        AutoTrigger: True
        AddActiveBonus:
            # target an ally within 3
            Filter: Ally
            Range: 3
            # only show the conditions that he has
            HasCondition: True
            CanUndo: False
            Targeting: Custom
            TargetingVars:
                AddValidActorsInRange: ActorsInRangeOfTarget
            Choose:
                Abilities:
                    # have to list them like this in order to actually get to choose which condition to remove
                    # otherwise it just seems to pick one in some random order
                    RemoveWound:
                        RemoveConditions: 1
                        Conditions: [Wound]
                    RemoveBrittle:
                        RemoveConditions: 1
                        Conditions: [Brittle]
                    RemoveBane:
                        RemoveConditions: 1
                        Conditions: [Bane]
                    RemovePoison:
                        RemoveConditions: 1
                        Conditions: [Poison]
                    RemoveImmobilize:
                        RemoveConditions: 1
                        Conditions: [Immobilize]
                    RemoveDisarm:
                        RemoveConditions: 1
                        Conditions: [Disarm]
                    RemoveImpair:
                        RemoveConditions: 1
                        Conditions: [Impair]
                    RemoveStun:
                        RemoveConditions: 1
                        Conditions: [Stun]
                    RemoveMuddle:
                        RemoveConditions: 1
                        Conditions: [Muddle]
        ActiveBonus:
            Duration: Persistent
            Behaviour: DuringActionAbilityOnShortRest
            Hidden: True
            Vars:
                # Copy-paste from below
                # Used as context above (implicit)
                FriendlyFilter: CAbilityFilterContainer.CreateDefaultFriendlyFilter()
                ActorsInRangeOfTarget: GameState.GetActorsInRange(TriggerActor, TriggerActor, 3, null, FriendlyFilter, null, null, true).Where(obj.Tokens.CountNegativeConditions() > 0)
            Requirements:
                Vars:
                    FriendlyFilter: CAbilityFilterContainer.CreateDefaultFriendlyFilter()
                    ActorsInRangeOfTarget: GameState.GetActorsInRange(Actor, Actor, 3, null, FriendlyFilter, null, null, true).Where(obj.Tokens.CountNegativeConditions() > 0)
                    ValidateHasTargets: ActorsInRangeOfTarget.Count > 0