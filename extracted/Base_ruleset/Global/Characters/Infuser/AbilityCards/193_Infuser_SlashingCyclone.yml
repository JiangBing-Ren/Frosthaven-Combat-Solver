Parser: AbilityCard
Name: $FH/193_character_ability_cards_infuser_slashing_cyclone_1$
Character: InfuserID
ID: 193
Level: 1
Initiative: 14
Discard: [Discard,Lost]
Prefab: 193_Infuser_SlashingCyclone
Data:
    Top:
        Abilities:
            TAttack:
                Attack: 
                    Amount: 2
                    SquareEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Attack")
                Target: 99
                Range: 1
                Filter: Enemy
                MultiPassAttack: False
                AnimOverload: SlashingCyclone 
                MiscVars:
                    AutoSelectValidTiles: True
        Consumes:
            TCAttack:
                PreviewEffectId: M1Attack
                AbilityOverrides:
                    TCAttackBuff:
                        ParentName: TAttack
                        Strength: -1
                        SubAbilities:
                            CSubInfuse:
                                Infuse: [Air]
                                SkipAnim: True
                                XP: 1
    Bottom:
        Abilities:
            BMove:
                Move: 
                    Amount: 5
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
                SubAbilities:
                    BDamage:
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        Damage: 1
                        MiscVars:
                            PrintedProperties: list("Damage")
                        Target: -1
                        Filter: Enemy
                        Targeting: Custom
                        TargetingVars:
                            TilesMoved: ParentAbility.TilesMoved.Select(ScenarioManager.GetTile(obj))
                            AdjacentTiles: CustomAbility.GetAdjacentTiles(TilesMoved, True)
                            AddValidActorsInRange: AdjacentTiles.Select(obj.LivingActor).Where(obj != null)
            BInfuse:
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars: 
                        ValidateActionHasHappened: CustomAbility.HasPerformedAction(Ability) 
                Infuse: [Air, Earth]
                ShowElementPicker: True
                CanSkip: False
        XP: 1
Layout:
    Top:
        - Row: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
        - Row: "$FH/193_character_ability_cards_infuser_slashing_cyclone_2$"
        - Conditional:
            Top: True
            Layout:
                - Consume:
                    Name: TCAttack
                    Text: "-1<sprite name=Attack>: <sprite name=CreateAir>, <sprite name=XP1>"
    Bottom:
        - Row: "<b><size=100%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "$FH/193_character_ability_cards_infuser_slashing_cyclone_3$"
        - MandatoryTrigger:
            Layout:
                - Row: "<sprite name=CreateMixed-AE>"

