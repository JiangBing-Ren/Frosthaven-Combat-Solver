        Abilities:
            BRepeat:
                RepeatAbility:
                Filter: [Self]
                AnimOverload: PowerUp
                ActiveBonus:
                    Duration: Persistent
                    Flags: [WhenFast]
                    XPTracker: [0,0,0,0]
