Parser: AbilityCard
Name: $FH/320_character_ability_cards_pain_conduit_chained_by_spite_1$
Character: PainConduitID
ID: 320
Level: 5
Initiative: 15
Discard: [Lost,Discard]
Prefab: 320_PainConduit_ChainedBySpite
Data:
    Top:
        XP: 2
        Abilities:
            TBuffStartTurnDamage:
                Filter: Self
                AddActiveBonus:
                    # choose how much damage
                    Filter: Self
                    HelpBoxTooltipLocKey: "$FH/320_character_ability_cards_pain_conduit_chained_by_spite_2$"
                    PreviewEffectText: "$FH/320_character_ability_cards_pain_conduit_chained_by_spite_2$"
                    MiscVars:
                        DontPreviewDescription: True
                    Choose:
                        Choices: [1,2,3]
                    SubAbilities:
                        # damage yourself
                        TDamageSelf_320:
                            Flags: [SubAbilityPreview]
                            TreatAsNonSubAbility: True
                            Damage: 0
                            Filter: Self
                            AutoTrigger: True
                            StatIsBasedOnX:
                                Strength:
                                    BasedOn: Vars
                                    Vars:
                                        Strength: ParentAbility.ChosenAbility?.Strength || 0
                                        Value: max(1, Strength)
                        TDamageEnemy:
                            TreatAsNonSubAbility: True
                            Damage: 0
                            Filter: Enemy
                            Range: 3
                            MiscVars:
                                PrintedProperties: list("Range")
                            AnimOverload: CastGivingPain
                            StatIsBasedOnX:
                                Strength:
                                    AddTo: True
                                    BasedOn: Vars
                                    Vars:
                                        DamageAbility: CustomAbility.FindAbilityInPhaseByName("TDamageSelf_320")
                                        Strength: CustomAbility.GetDamageDealt(DamageAbility)
                                        Value: max(1, Strength)
                AnimOverload: Cast
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: StartTurnAbility
                    IsToggleBonus: True
    Bottom:
        Infuse: Fire
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
            BRetaliate:
                Retaliate: 
                    Amount: 2
                    SquareEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Retaliate", "RetaliateRange")
                Filter: Self
                RetaliateRange: 2
                AnimOverload: Cast
                ActiveBonus:
                    Duration: Round
                    ListLayoutOverride: ["<sprite name=Retaliate> *BRetaliate*", Positive_Retaliate]
Layout:
    Top:
        - Active:
            Ability: TBuffStartTurnDamage
            Icon: "Positive_PainConduit_Thorns"
            ListLayout: "$FH/320_character_ability_cards_pain_conduit_chained_by_spite_2$"
            Layout: "$FH/320_character_ability_cards_pain_conduit_chained_by_spite_2$"
    Bottom:      
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row:
            - ColumnWidths: "20,30,30"
            - Column:
            - Column:
                - Row: "<b><size=130%><sprite name=Retaliate> *BRetaliate* <size=100%><voffset=1>@BRetaliate@"
            - Column:
                - Row: "<mark=#80919922><size=100%><sprite name=Range>*BRetaliate.RetaliateRange*</mark>"
        - MandatoryTrigger:
            Layout:
                - Infuse: Fire