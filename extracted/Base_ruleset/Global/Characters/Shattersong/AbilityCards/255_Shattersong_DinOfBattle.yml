                Resonance: 4
                AbilityOverrides:
                    BRangeBuff4:
                        ParentName: BAttackBuff
                        Range: 4
            BCResonance5:
                ConsumeGroup: DinOfBattleRangeChoice
                Resonance: 5
                AbilityOverrides:
                    BRangeBuff5:
                        ParentName: BAttackBuff
                        Range: 5
