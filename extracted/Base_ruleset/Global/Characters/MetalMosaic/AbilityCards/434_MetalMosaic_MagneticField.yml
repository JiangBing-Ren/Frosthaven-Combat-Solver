                MiscVars:
                    PrintedProperties: list("Pull","Range")
                Target: 99
                Filter: Enemy
                AnimOverload: Control_Blank
            BPull2:
                Pull: 1
                Range: 2
                MiscVars:
                    PrintedProperties: list("Pull","Range")
                Target: 99
                Filter: Enemy
                AnimOverload: Control_Blank
            BShield:
