Parser: ScenarioAbility
ID: ScenarioAbility_FH43_Ranged
ScenarioAbility:
    AActive:
        MiscVars:
            ListLayoutParamVar1: 5 + ScenarioManager.CurrentScenarioState.Level
        AddActiveBonus:
            AnimOverload: UseItem
            Flags: [Special1]
            Attack:
                Amount: 5
                Pierce: 3
            SubAbilities:
                TAttackSubPull:
                    Pull:
                        Amount: 3
            StatIsBasedOnX:
                Strength:
                    BasedOn: XPlusLevel
                    Multiplier: 0
                    AddTo: True
            MultiPassAttack: False
            Range: 5
            Target: 1
            Targeting: Range
            Filter: Enemy
            PreviewEffectText: <sprite name="Damage">
            CanSkip: False
            MiscVars:
                # to allow skipping this even if we have no valid targets
                TreatAsAlwaysPerformable: True 
            # exception - deathwalker attacks have to be one by one to handle shadow marking
            ConditionalOverrides:
                MultiPassIfDeathwalkerCO:
                    Self: True
                    Requirement:
                        Vars:
                            IsDeathwalkerShadowMarked: CustomAbility.IsDeathwalkerShadowMarked(Ability)
                    AbilityOverrides:
                        Attack1:
                            MultiPassAttack: True
        ActiveBonus:
            Duration: Persistent
            Behaviour: DuringTurnAbility
            XPTracker: [0]
            Restriction: OncePerTurn
            IsToggleBonus: True
            Hidden: True
            Requirements: 
                ForgoTopAction: True
                Vars:
                    ValidateNotOutOfPhase: GameState.IsPerformingCardOutOfPhase == False
            ListLayoutOverride: ["$FH/FH_Scenario_Campaign_043_SCENARIO_ABILITY_1_1$ {1} $FH/FH_Scenario_Campaign_043_SCENARIO_ABILITY_1_2$", Positive_Unique_Campaign]
