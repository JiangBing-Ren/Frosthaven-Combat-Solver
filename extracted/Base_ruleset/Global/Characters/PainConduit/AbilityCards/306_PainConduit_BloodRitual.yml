Prefab: 306_PainConduit_BloodRitual
Data:
    Top:
        Abilities:
            TAttack: 
                Attack:
                    Amount: 4
                    DiamondEnhancements: 1
                Range: 3
                MiscVars:
                    PrintedProperties: list("Attack","Range")
                AnimOverload: RangedAttack
            TDamageSelf:
                Filter: Self
                Damage: 2
                MiscVars:
                    PrintedProperties: list("Damage")
                AutoTrigger: True
    Bottom:
        XP: 2
        Abilities:
            BActive:
                Range: 3
                AddActiveBonus:
                    PreviewEffectText: "$FH/306_character_ability_cards_pain_conduit_blood_ritual_3$"
                    AutoTrigger: True
                    NullTargeting: True
                    Filter: Self
                    AnimOverload: CastTakingPain
                    Vars:                  
                        AddNegativeConditions: list(PreventedCondition)
