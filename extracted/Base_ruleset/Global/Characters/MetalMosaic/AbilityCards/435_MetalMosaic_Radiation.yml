Parser: AbilityCard
Name: $FH/435_character_ability_cards_metal_mosaic_radiation_1$
Character: MetalMosaicID
ID: 435
Level: 5
Initiative: 37
Discard: [Discard,Discard]
Prefab: 435_MetalMosaic_Radiation
Data:
    Top:
        Abilities:
            TAttack:
                Conditions: [Poison]
                Attack:
                    Amount: 5
                    DiamondEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Attack")
                AnimOverload: RangedAttack_Radiation
                PerformVars:
                    PreActorIsAttacking:
                        ChangePressureRegular: TargetingActor.Pressure.ToString() == 'Regular' && CustomAbility.PressureChange(TargetingActor, -1)
                        ChangePressureHigh: TargetingActor.Pressure.ToString() == 'High' && CustomAbility.PressureChange(TargetingActor, 1)
                StatIsBasedOnX:
                    Strength:
                        BasedOn: Vars
                        AddTo: True
                        Vars:
                            HighPressure: TargetingActor.Pressure.ToString() == 'High'
                            RegularPressure: TargetingActor.Pressure.ToString() == 'Regular'
                            HighOrRegular: HighPressure || RegularPressure
                            Value: HighOrRegular && -1 || 0
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
            TDamageAdjacentOnSelfDamageBonus:
                PreventDamage: 0
                Filter: Self
                CanUndo: False
                AnimOverload: CastNeutral
                ActiveBonus:
                    Behaviour: PreventFirstDamage
                    Duration: Persistent
                    Restriction: OncePerScenario
                    TriggerOnCaster: True
                    XPTracker: [0]
                    AbilityData:
                        AutoTrigger: False
                        PreviewEffectText: ""
                        Damage: 0
                        Target: 1
                        CanSkip: False
                        Range: 1
                        Filter: Enemy
                        AnimOverload: RangedAttack
                        MiscVars:
                            InterruptCurrentAbility: False
                            StackNextToCurrent: False
                            ApplyImmediately: False
                        StatIsBasedOnX:
                            Strength:
                                BasedOn: Vars
                                Vars:
                                    Value: Actor.LastAbilityDamagedBy.Strength
                    Requirements:
                        AbilityTypes: [Damage]
                        Vars:
                            TriggerDamageAbility: Actor.LastAbilityDamagedBy
                            ValidateDamagedByAbility: "!!TriggerDamageAbility"
                            ValidateAdjacentEnemies: GameState.GetAdjacentEnemies(Actor, Actor.ArrayIndex).Count > 0
                            ValidateIsSelfPressureDamage: CustomAbility.GetMiscVarBool(TriggerDamageAbility, "MetalMosaicSelfDamage")
                    Vars:
                        TriggerDamageAdjacent: CustomAbility.PerformActiveBonusAbility(ActiveBonus, thisContext)


Layout:
    Top:
        - Row: 
            - ColumnWidths: "50,50"
            - Column: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column: "<sprite name=Poison>"
        - MandatoryTrigger:
            Layout:
                - Row: "<size=130%><sprite name=MMPressureHigh><size=100%> -1<sprite name=Attack>, <sprite name=MMGainPressure>"
        - MandatoryTrigger:
            Layout:
                - Row: "<size=130%><sprite name=MMPressureRegular><size=100%> -1<sprite name=Attack>, <sprite name=MMLosePressure>"
    Bottom:
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Active:
            Ability: TDamageAdjacentOnSelfDamageBonus
            Icon: Positive_DamageRedirect_MetalMosaic
            ListLayout: "$FH/435_character_ability_cards_metal_mosaic_radiation_2$"
            Layout: "$FH/435_character_ability_cards_metal_mosaic_radiation_2$"
        - XPTracker: TDamageAdjacentOnSelfDamageBonus
