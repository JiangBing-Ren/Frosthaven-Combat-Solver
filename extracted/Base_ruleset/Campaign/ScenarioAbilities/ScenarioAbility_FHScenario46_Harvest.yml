            Requirements:
                ForgoTopAction: True
                Vars:
                    ValidateHasSnowInRange: CustomAbility.GetAdjacentVFXProps(Actor, "HarvestSnow") > 0
            ListLayoutOverride: [$FH/FH_Scenario_Campaign_046_HarvestAbility$, AA_Kill]
            Hidden: True
        AnimOverload: None
        AutoTrigger: True