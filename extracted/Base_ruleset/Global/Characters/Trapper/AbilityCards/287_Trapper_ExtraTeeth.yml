Parser: AbilityCard
Name: $FH/287_character_ability_cards_trapper_extra_teeth_1$
Character: TrapperID
ID: 287
Level: 3
Initiative: 22
Discard: [Discard,Discard]
Prefab: 287_Trapper_ExtraTeeth
Data:
    Top:
        Abilities:
            TTrap:
                Trap:
                    TrapName: TrapperTrap
                    Damage: 5
                    SquareEnhancements: 1
                Range: 3
                MiscVars:
                    PrintedProperties: list("Damage","Range")
                RangeIsBase: True
                AnimOverload: TrapThrow
        XP: 1
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 2
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
            BDestroyTraps:
                DisarmTrap: true
                Range: 1
                RangeIsBase: true
                Target: -1
                AnimOverload: DisassembleTrap_Tinker
                Vars:
                    AdjacentTilesWithTraps: CustomAbility.GetAdjacentTiles(TargetingActor.Tile).Where(Trap)
                    ValidateHasAdjacentTraps: AdjacentTilesWithTraps.Count > 0
                    ValidateHasTrapSpawnPosition: AdjacentTilesWithTraps.Any(IsEmptyIgnoreTraps) || GameState.GetTilesInRange(TargetingActor, 2).Any(IsEmpty)
                    AddSelectedTiles: AdjacentTilesWithTraps
                PerformVars:
                    DisarmTrap:
                        DestroyedTraps: TilesSelected.Select(Trap)
            BTrap:
                Trap:
                    TrapName: TrapperTrap
                Range: 2
                MiscVars:
                    PrintedProperties: list("Range")
                RangeIsBase: True
                AnimOverload: TrapThrow
                CanSkip: false
                Vars:
                    DestroyTrapsAbility: CustomAbility.FindAbilityInPhaseByName("BDestroyTraps")
                    DestroyedTraps: DestroyTrapsAbility?.DestroyedTraps
                    ValidateDestroyedTraps: "!!DestroyedTraps?.First"
                PerformVars:
                    TrapPlaced:
                        NewTrap: TilesSelected?.First?.Trap
                        AddTrapEffects: DestroyedTraps.Select(CustomAbility.AddTrapEffects(NewTrap, obj))
Layout:
    Top:
        - Row: "$FH/287_character_ability_cards_trapper_extra_teeth_2$ <sprite name=Damage>*TTrap* @TTrap@"
        - Row: $FH/287_character_ability_cards_trapper_extra_teeth_3$
    Bottom:
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Row: "<size=20%> "
        - Row: "$FH/287_character_ability_cards_trapper_extra_teeth_4$"
