                        InterruptCurrentAbility: True
                        # actual description is too long, and cant be shortened via icons. Just show the name
                        UseTitleAsOverrideDescription: True
                AnimOverload: Cast
                ActiveBonus:
                    Duration: Persistent
                    Behaviour: GenericOnNegativeCondition
                    TriggerOnCaster: True
                    TriggerAbilitiesImmediately: True
                    IsToggleBonus: True
                    IsAura: True
                    AuraFilter: Ally
                    AuraTargeting: Range
                    HiddenWhenAura: True
                    Vars:
                        ValidateIsntCaster: TriggerTarget != ActiveBonus.Caster && TriggerTarget != ActiveBonus.Caster.GetMirrorAbilitiesActor(true)
                        ValidateNotImmune: CAbility.ImmuneToAbility(TriggerTarget, TriggerAbility) == False
                        PreventedCondition: CCondition.NegativeConditionFromAbility(TriggerAbility.AbilityType)
                        PreventCondition: True
Layout:
    Top:
        - Row:
            - ColumnWidths: "20,30,30"
            - Column:
