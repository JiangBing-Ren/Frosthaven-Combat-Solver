Data:
    Top:
        Abilities:
            TCreateWaterNullHex:
                NullHex: True
                Range: 2
                TileFilter: FeaturelessHex
                AreaEffect: "0,0,R|2,0,R"
                SkipAnim: True
                MiscVars:
                    RequiresAnyTileAdjacentToCaster: True
                    includeCasterTile: True
                SubAbilities:
                    TCreateWater:
                        CreateTerrain: Water
                        TileFilter: FeaturelessHex
                        Vars:
                            OverridePropName: "'CrashingTideWater'"
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        Target: -1
                        Targeting: Custom
                        TargetingVars:
                            AddSelectedTiles: ParentAbility.TilesSelected
                        AnimOverload: CreateWaterTile
                        MiscVars:
                            LinkProps: True
                    TWaitForIdle:
                        Null: True
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                    TDamage:
                        Damage: 1
                        MiscVars:
                            PrintedProperties: list("Damage")
                        Conditions: [Immobilize]
                        TreatAsNonSubAbility: True
                        AutoTrigger: True
                        Target: -1
                        Targeting: Custom
                        TargetingVars:
                            AddTilesInRange: ParentAbility.TilesSelected
                            AddValidActorsInRange: ParentAbility.TilesSelected.Select(LivingActor).Where(obj != null && !CActor.AreActorsAllied(obj.Type, CActor.EType.Player, obj, null))
                            AddActorsToTarget: AddValidActorsInRange
                        AnimOverload: MeleeSwing
    Bottom:
        Abilities:
            BChooseWaterTile:
                NullHex: True
                Range: 1
                Target: 1
                Targeting: Range
                TileFilter: Custom
                SkipAnim: True
                MiscVars:
                    IsValidTile: obj.FindWaterProp() != null
                    includeCasterTile: True
            BMove:
                Move: 3
                MiscVars:
                    PrintedProperties: list("Move")
            BMoveWaterTile:
                MoveTerrain:
                TerrainTypes: [TerrainWater]
                Target: 1
                CanUndo: False
                Targeting: PerformVars
                StartAbilityRequirements:
                    Type: ThisAbility
                    Vars:
                        ChooseWaterTileAbility: CustomAbility.FindAbilityInPhaseByName("BChooseWaterTile")
                        ValidateAnyWaterTileSelected: ChooseWaterTileAbility != null && ChooseWaterTileAbility.TilesSelected.Where(obj.FindTerrainProp(true) != null).Count > 0
                PerformVars:
                    SelectTerrainToMove:
                        ChooseWaterTileAbility: CustomAbility.FindAbilityInPhaseByName("BChooseWaterTile")
                        AddTilesInRange: ChooseWaterTileAbility.TilesSelected
                        TilesSelected: ChooseWaterTileAbility.TilesSelected
                    SelectMoveToTile:
                        AddTilesInRange: GameState.GetTilesInRange(TargetingActor, 1)?.Where(IsFeatureless && IsWalkable)
                AnimOverload: CreateWaterTile
                MiscVars:
                    includeCasterTile: True
