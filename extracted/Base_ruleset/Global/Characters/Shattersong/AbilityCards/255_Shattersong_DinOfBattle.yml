        Consumes:
            BCResonance1:
                PreviewEffectId: "$255_character_ability_cards_shattersong_din_of_battle_1$"
                PreviewEffectText: "-X<sprite name=SSResonance>: +X<sprite name=Range>"
                ConsumeGroup: DinOfBattleRangeChoice
                Resonance: 1
                AbilityOverrides:
                    BRangeBuff1:
                        ParentName: BAttackBuff
                        Range: 1
            BCResonance2:
                ConsumeGroup: DinOfBattleRangeChoice
                Resonance: 2
                AbilityOverrides:
                    BRangeBuff2:
                        ParentName: BAttackBuff
                        Range: 2
            BCResonance3:
                ConsumeGroup: DinOfBattleRangeChoice
                Resonance: 3
                AbilityOverrides:
                    BRangeBuff3:
                        ParentName: BAttackBuff
                        Range: 3
            BCResonance4:
