Parser: AbilityCard
Name: $FH/418_character_ability_cards_metal_mosaic_ancient_drill_1$
Character: MetalMosaicID
ID: 418
Level: 1
Initiative: 90
Discard: [Discard,Discard]
Prefab: 418_MetalMosaic_AncientDrill
Data:
    Top:
        Abilities:
            TAttack:
                Attack:
                    Amount: 3
                    DiamondEnhancements: 1
                    Pierce: 1
                MiscVars:
                    PrintedProperties: list("Attack","Pierce")
                AnimOverload: Attack_Strong 
                PerformVars:
                    PreActorIsAttacking:
                        ChangePressureHigh: TargetingActor.Pressure.ToString() == 'High' && CustomAbility.PressureChange(TargetingActor, -1)
                        ChangePressureOver: TargetingActor.Pressure.ToString() == 'Over' && CustomAbility.PressureChange(TargetingActor, -1)
                StatIsBasedOnX:
                    Strength:
                        BasedOn: Vars
                        AddTo: True
                        Vars:
                            OverPressure: TargetingActor.Pressure.ToString() == 'Over'
                            HighPressure: TargetingActor.Pressure.ToString() == 'High'
                            Value: OverPressure && 2 || HighPressure && 1 || 0
                    Pierce:
                        BasedOn: Vars
                        AddTo: True
                        Vars:
                            OverPressure: TargetingActor.Pressure.ToString() == 'Over'
                            HighPressure: TargetingActor.Pressure.ToString() == 'High'
                            Value: OverPressure && 3 || HighPressure && 2 || 0
                    XP:
                        BasedOn: Vars
                        Vars:
                            OverOrHighPressure: TargetingActor.Pressure.ToString() == 'Over' || TargetingActor.Pressure.ToString() == 'High'
                            Value: OverOrHighPressure && 1 || 0
                SubAbilities:
                    SelfDamage:
                        Damage: 1
                        MiscVars:
                            PrintedProperties: list("Damage")
                        AutoTrigger: True
                        Filter: Self
                        SkipAnim: True
                        MiscVars:
                            MetalMosaicSelfDamage: True
                        StartAbilityRequirements:
                            Type: ThisAbility
                            RequiredPressure: Over
    Bottom:
        Abilities:
            BMove:
                Move:
                    Amount: 3
                    CircleEnhancements: 1
                MiscVars:
                    PrintedProperties: list("Move")
            BDestroyObstacles:
                DestroyObstacle: True
                Range: 1
                Target: 1
                Targeting: Range
                AnimOverload: Attack_Strong
                SubAbilities:
                    BPressureChangeRegular:
                        Null: True
                        SkipAnim: True
                        IgnoreStun: True
                        PerformVars:
                            NullBegin:
                                ChangePressure: CustomAbility.PressureChange(TargetingActor, 1)
Layout:
    Top:
        - Row: 
            - ColumnWidths: "50,50"
            - Column: "<b><size=130%><sprite name=Attack> *TAttack* <size=100%><voffset=1>@TAttack@"
            - Column: "<b><size=130%><sprite name=Pierce> 1"
        - MandatoryTrigger:
            Layout:
                - Row: "<size=130%><sprite name=MMPressureOver><size=100%> +2<sprite name=Attack>, +3<sprite name=Pierce>, <sprite name=XP1>, <sprite name=MMSelfDamage>, <sprite name=MMLosePressure>"
        - Row: "<size=50%> "
        - MandatoryTrigger:
            Layout:
                - Row: "<size=130%><sprite name=MMPressureHigh><size=100%> +1<sprite name=Attack>, +2<sprite name=Pierce>, <sprite name=XP1>, <sprite name=MMLosePressure>"
    Bottom:
        - Row: "<b><size=130%><sprite name=Move> *BMove* <size=100%><voffset=1>@BMove@"
        - Divider:
        - Row: "$FH/418_character_ability_cards_metal_mosaic_ancient_drill_2$" 
