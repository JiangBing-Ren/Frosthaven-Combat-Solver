Parser: ScenarioAbility
ID: ScenarioAbility_RecoverAllDiscardedCard_EndOfFirstRound_Self
ScenarioAbility:
    TBuff:
        Filter: Self
        AutoTrigger: True
        SkipAnim: True
        AddActiveBonus:
            RecoverDiscardedCards: All
            Filter: Self
            AutoTrigger: True
        ActiveBonus:
            Duration: Persistent
            Behaviour: StartRoundAbility
            ListLayoutOverride: [$FH/ScenarioAbility_RecoverAllDiscardedCard_EndOfFirstRound_Self$, RecoverIcon]
            XPTracker: [0]
            Requirement:
                Vars:
                    ValidateIsFirstRound: ScenarioManager.CurrentScenarioState.RoundNumber == 2